<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERRASCOPE — planetary intelligence</title>
<meta name="description" content="Near-real-time NASA Earth-observation events as a decisive disaster-briefing command center.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c10; --panel:#0f1218; --panel2:#131722; --ink:#e8e9eb; --dim:#8a93a3; --faint:#565f6e; --line:#1e2530;
    --wildfires:#f06a4f; --severeStorms:#8f9ff0; --volcanoes:#f0a24f;
    --seaLakeIce:#7cc7e8; --earthquakes:#e8e07c; --other:#9aa3b0;
    --live:#4ade80;
    --sans:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);overflow:hidden;-webkit-font-smoothing:antialiased}
  #app{display:grid;grid-template-columns:392px 1fr;height:100vh}
  @media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}

  /* left panel */
  #panel{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
  header{padding:22px 22px 18px;border-bottom:1px solid var(--line)}
  h1{font-family:var(--sans);font-size:19px;letter-spacing:.18em;font-weight:600}
  h1 span{color:var(--faint);font-weight:400}
  .sub{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:10px;margin-top:8px;letter-spacing:.14em}
  .sub::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live);animation:blink 2.4s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .brief{padding:14px 22px;border-bottom:1px solid var(--line);border-left:2px solid var(--faint);font-size:11px;color:var(--dim);line-height:1.75;background:var(--panel2)}
  .brief b{color:var(--ink);font-weight:500}
  #chips{display:flex;flex-wrap:wrap;gap:6px;padding:14px 22px;border-bottom:1px solid var(--line)}
  .chip{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:10px;padding:5px 10px;border-radius:3px;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;transition:color .15s,border-color .15s,background .15s}
  .chip .n{opacity:.55;margin-left:5px}
  .chip:hover{color:var(--ink);border-color:var(--faint)}
  .chip.on{color:var(--bg);background:var(--ink);border-color:var(--ink)}
  .chip.on .n{opacity:.7}
  #list{flex:1;overflow-y:auto;min-height:0}
  #list::-webkit-scrollbar{width:8px}
  #list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  #list::-webkit-scrollbar-thumb:hover{background:var(--faint)}
  .ev{position:relative;padding:13px 22px 13px 26px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
  .ev::before{content:"";position:absolute;left:14px;top:18px;width:6px;height:6px;border-radius:50%;background:var(--faint)}
  .ev:hover{background:var(--panel2)}
  .ev.sel{background:var(--panel2);box-shadow:inset 2px 0 0 var(--ink)}
  .ev-cat{font-size:9px;letter-spacing:.22em;text-transform:uppercase;font-weight:500}
  .ev-title{font-family:var(--sans);font-size:13.5px;margin-top:5px;line-height:1.45;color:var(--ink)}
  .ev-meta{font-size:10px;color:var(--faint);margin-top:5px;letter-spacing:.04em}
  .status{padding:32px 22px;color:var(--faint);font-size:11px;text-align:center;letter-spacing:.06em}

  /* detail drawer */
  #detail{border-top:1px solid var(--line);padding:16px 22px 18px;font-size:11px;display:none;background:var(--panel2)}
  #detail h2{font-family:var(--sans);font-size:14px;font-weight:600;margin-bottom:8px;letter-spacing:.01em;line-height:1.4}
  #detail .d-row{color:var(--dim);margin:5px 0;line-height:1.65}
  #detail a{color:var(--seaLakeIce);text-decoration:none;border-bottom:1px solid transparent}
  #detail a:hover{border-bottom-color:var(--seaLakeIce)}

  #map{background:var(--bg)}
  .mk{border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 10px rgba(0,0,0,.5)}
  .leaflet-container{background:var(--bg);font-family:var(--mono)}
  .leaflet-popup-content-wrapper{background:var(--panel2);color:var(--ink);font-family:var(--mono);border-radius:4px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .leaflet-popup-tip{background:var(--panel2);border:1px solid var(--line)}
  .leaflet-popup-content{font-size:11px;line-height:1.5}
  .leaflet-bar{border:1px solid var(--line)!important;box-shadow:0 4px 12px rgba(0,0,0,.4)!important}
  .leaflet-bar a{background:var(--panel2);color:var(--ink);border-color:var(--line);width:28px;height:28px;line-height:28px}
  .leaflet-bar a:hover{background:var(--panel);color:#fff}
  .leaflet-control-attribution{background:rgba(10,12,16,.7)!important;color:var(--faint)!important;font-size:9px!important}
  .leaflet-control-attribution a{color:var(--dim)!important}
  .credit{position:absolute;bottom:8px;left:10px;font-size:9px;color:var(--faint);z-index:500;letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <header>
      <h1>TERRA<span>SCOPE</span></h1>
      <div class="sub">NASA EONET · EARTH EVENT BRIEFING · LIVE</div>
    </header>
    <div class="brief" id="brief">acquiring planetary feed…</div>
    <div id="chips"></div>
    <div id="list"><div class="status">contacting eonet.gsfc.nasa.gov…</div></div>
    <div id="detail"></div>
  </div>
  <div style="position:relative;min-height:0">
    <div id="map"></div>
    <div class="credit">events: NASA EONET v3 · tiles: CARTO/OSM</div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  var CATCOLORS={wildfires:'#f06a4f',severeStorms:'#8f9ff0',volcanoes:'#f0a24f',seaLakeIce:'#7cc7e8',earthquakes:'#e8e07c'};
  function col(cat){return CATCOLORS[cat]||'#9aa3b0'}
  var map=L.map('map',{zoomControl:true,worldCopyJump:true}).setView([25,-10],2);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:12,attribution:'© OpenStreetMap © CARTO'}).addTo(map);

  var events=[], filter='all', markers=[], selId=null;
  var list=document.getElementById('list'), brief=document.getElementById('brief'),
      chips=document.getElementById('chips'), detail=document.getElementById('detail');

  fetch('https://eonet.gsfc.nasa.gov/api/v3/events?status=open&limit=200')
    .then(function(r){return r.json()})
    .then(function(d){ events=d.events||[]; buildChips(); render(); })
    .catch(function(){ list.innerHTML='<div class="status">feed unreachable - check connection</div>'; brief.textContent='signal lost'; });

  function latestGeom(ev){ return (ev.geometry||[]).slice().sort(function(a,b){return new Date(a.date)-new Date(b.date)}).pop() }
  function cats(){
    var seen={};
    events.forEach(function(e){(e.categories||[]).forEach(function(c){seen[c.id]=c.title})});
    return Object.keys(seen).map(function(k){return {id:k,title:seen[k]}});
  }
  function buildChips(){
    chips.innerHTML='';
    var counts={all:events.length};
    events.forEach(function(e){(e.categories||[]).forEach(function(c){counts[c.id]=(counts[c.id]||0)+1})});
    [['all','all']].concat(cats().map(function(c){return [c.id,c.title]})).forEach(function(p){
      var b=document.createElement('button'); b.className='chip'+(p[0]===filter?' on':'');
      b.textContent=p[1];
      var n=document.createElement('span'); n.className='n'; n.textContent=counts[p[0]]||0; b.appendChild(n);
      b.onclick=function(){filter=p[0];selId=null;buildChips();render()};
      chips.appendChild(b);
    });
  }
  function render(){
    markers.forEach(function(m){map.removeLayer(m)}); markers=[];
    var shown=events.filter(function(e){
      return filter==='all'||(e.categories||[]).some(function(c){return c.id===filter});
    });
    // briefing
    var byCat={};
    shown.forEach(function(e){(e.categories||[]).forEach(function(c){byCat[c.title]=(byCat[c.title]||0)+1})});
    var parts=Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a]}).slice(0,4)
      .map(function(k){return '<b>'+byCat[k]+'</b> '+k.toLowerCase()});
    brief.innerHTML='<b>'+shown.length+'</b> active events tracked right now'+(parts.length?' — '+parts.join(' · '):'')
      +'<br>source: NASA EONET · updated '+new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});

    list.innerHTML='';
    if(!shown.length){list.innerHTML='<div class="status">no active events in this class</div>'}
    shown.forEach(function(e){
      var g=latestGeom(e); if(!g) return;
      var cat=(e.categories&&e.categories[0])||{id:'',title:'Event'};
      var row=document.createElement('div'); row.className='ev'+(e.id===selId?' sel':'');
      var c=col(cat.id);
      row.style.setProperty('--faint',c); row.innerHTML='<div class="ev-cat" style="color:'+c+'">'+cat.title+'</div>'+
        '<div class="ev-title"></div>'+
        '<div class="ev-meta">'+new Date(g.date).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'</div>';
      row.querySelector('.ev-title').textContent=e.title;
      row.onclick=function(){select(e.id,true)};
      list.appendChild(row);

      var ll=[g.coordinates[1],g.coordinates[0]];
      var m=L.marker?null:null;
      var mk=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="mk" style="width:11px;height:11px;background:'+c+'"></div>',iconSize:[15,15],iconAnchor:[7,7]})});
      mk.addTo(map).on('click',function(){select(e.id,false)});
      markers.push(mk);
    });
  }
  function select(id,pan){
    selId=id; render();
    var e=events.find(function(x){return x.id===id}); if(!e) return;
    var g=latestGeom(e);
    if(pan&&g) map.flyTo([g.coordinates[1],g.coordinates[0]],6,{duration:.8});
    var cat=(e.categories&&e.categories[0])||{title:'Event'};
    var track=(e.geometry||[]).slice(-5).reverse().map(function(p){
      return new Date(p.date).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    }).join(' · ');
    var srcs=(e.sources||[]).map(function(s){return '<a href="'+s.url+'" target="_blank" rel="noopener">'+s.id+'</a>'}).join(' · ');
    detail.style.display='block';
    detail.innerHTML='<h2 style="color:'+col((e.categories&&e.categories[0]||{}).id)+'"></h2>'+
      '<div class="d-row">'+cat.title.toUpperCase()+' · '+(e.closed?'CLOSED':'ACTIVE')+'</div>'+
      (track?'<div class="d-row">track: '+track+'</div>':'')+
      (srcs?'<div class="d-row">sources: '+srcs+'</div>':'')+
      '<div class="d-row"><a href="https://eonet.gsfc.nasa.gov/api/v3/events/'+e.id+'" target="_blank" rel="noopener">raw EONET record ↗</a></div>';
    detail.querySelector('h2').textContent=e.title;
    detail.scrollIntoView();
  }
})();
</script>
</body>
</html>
